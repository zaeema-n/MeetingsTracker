# MeetingsTracker — global ministry pack schema
# Same layout for every ministry folder under data/. Drives OpenGIN ingestion mapping.

version: 1

overview: |
  One ministry's dataset under data/<Ministry name>/. Government (Organisation/government)
  is the root; president (Person/citizen) is resolved under government at --active-at.
  Boards/councils and other files are created with explicit ids.
  Meetings hold types and instances. RTIs record requests and what they discovered.

pack:
  requires_active_at: true
  files:
    acts: acts.yaml
    organisations: organisations.yaml
    meetings: meetings.yaml
    rtis: rtis.yaml

entities:
  act:
    file: acts
    collection: acts
    id_field: id
    name_field: name
    kind: { major: Document, minor: Act }
    default_ingest: create

  government:
    file: organisations
    collection: government
    id_field: id
    name_field: name
    kind: { major: Organisation, minor: government }
    default_ingest: resolve
    resolve_without_active_at: true

  president:
    file: organisations
    collection: government → president
    id_field: id
    name_field: name
    kind: { major: Person, minor: citizen }
    default_ingest: resolve
    parent_relationships:
      - relation: AS_PRESIDENT
        parent_type: government
        parent_id_from: _parent_government_id

  ministry:
    file: organisations
    collection: government → president → ministry
    id_field: id
    name_field: name
    kind: { major: Organisation, minor: Ministry }
    default_ingest: resolve
    parent_relationships:
      - relation: AS_MINISTER
        parent_type: president
        parent_id_from: _parent_president_id

  department:
    file: organisations
    collection: government → president → ministry → department
    id_field: id
    name_field: name
    kind: { major: Organisation, minor: Department }
    default_ingest: resolve
    parent_relationships:
      - relation: AS_DEPARTMENT
        parent_type: ministry
        parent_id_from: _parent_ministry_id

  board:
    file: organisations
    collection: government → president → ministry → department → board
    default_ingest: create
    id_field: id
    name_field: name
    kind: { major: Organisation, minor: Board }
    parent_relationships:
      - relation: AS_BODY
        parent_type: department
        parent_id_from: _parent_department_id
      - relation: AS_BODY
        parent_type: ministry
        parent_id_from: _parent_ministry_id

  council:
    file: organisations
    collection: government → president → ministry → department → council
    default_ingest: create
    id_field: id
    name_field: name
    kind: { major: Organisation, minor: Council }
    parent_relationships:
      - relation: AS_BODY
        parent_type: department
        parent_id_from: _parent_department_id
      - relation: AS_BODY
        parent_type: ministry
        parent_id_from: _parent_ministry_id

  meeting:
    file: meetings
    collection: meetings
    id_field: id
    name_field: name
    kind: { major: Event, minor: Meeting }
    default_ingest: create

  meeting_instance:
    file: meetings
    collection: meetings → instances
    id_field: id
    name_field: name
    kind: { major: Event, minor: MeetingInstance }
    default_ingest: create
    parent_relationships:
      - relation: HAS_EVENT
        parent_type: meeting
        parent_id_from: _parent_meeting_id

  rti_document:
    file: rtis
    collection: rti_documents
    id_field: id
    name_field: name
    kind: { major: Document, minor: RTI }
    default_ingest: create
    # attributes:
    #   - key: summary
    #     source: summary

# Cross-file reference links: YAML field names → OpenGIN relation names.
# field: YAML key to read; relation: OpenGIN edge name; target: allowed entity type(s).
# at: optional scope — entity-type list, or nested container (e.g. sent_to.recipient_id).
# many: true when the YAML value is a list of ids.
# "on": child (default) — edge on entity being created (child --relation--> target id).
#       target — deferred edge on referenced id (target --relation--> child).
#       Quote the key: YAML 1.1 treats bare `on` as boolean true.
# Distinct from parent_relationships (YAML tree hierarchy).
links:
  - field: mandated_by
    relation: mandates
    target: act
    "on": target

  - field: meetings
    relation: has_event
    at: [ministry, department, board, council]
    target: meeting
    many: true

  - field: recipient_id
    relation: sent_to
    at: sent_to
    target: [ministry, department, board, council]

  - field: discovered_events
    relation: discovers
    target: meeting_instance
    many: true
